on:
  push:
    branches: ["main"] # Triggers the action every time you push to the main branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Downloads your repository code to the runner

      - name: Setup Pages
        uses: actions/configure-pages@v5 # Configures Pages for the runner

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3 # Bundles and compresses files
        with:
          path: '.' # Serves files from the root directory. Change to './public' or './dist' if needed.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Publishes the artifact online
